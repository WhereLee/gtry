services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d helpdesk"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/helpdesk
      FLYWAY_URL: jdbc:postgresql://postgres:5432/helpdesk
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DATABASE: 0
      HELPDESK_EMBEDDING_MODEL_PATH: /models/bge-base-zh-v1.5-onnx-int8
      HELPDESK_RERANK_MODEL_PATH: /models/bge-reranker-base-onnx-int8
      LOG_FILE: /app/logs/helpdesk.log
    volumes:
      - ./models:/models:ro
      - ./logs:/app/logs
    ports:
      - "127.0.0.1:8091:8091"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
