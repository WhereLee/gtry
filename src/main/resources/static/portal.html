<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Helpdesk 客户中心</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
    <link rel="stylesheet" href="/style.css"/>
</head>
<body class="portal-body">
<header class="portal-top">
    <div class="brand">Helpdesk 客户中心</div>
    <div class="muted small" id="portal-channel"></div>
</header>
<main class="portal-main">
    <section id="create-panel" class="portal-card">
        <h1>提交问题</h1>
        <p class="muted">留下联系方式，客服会尽快处理。</p>
        <form id="create-form" class="portal-form">
            <label>标题<input id="p-subject" required maxlength="255" placeholder="例如：订单退货咨询"/></label>
            <label>问题描述<textarea id="p-description" rows="5" required maxlength="20000"
                                     placeholder="请描述遇到的问题、订单号或期望的处理方式"></textarea></label>
            <div class="portal-grid">
                <label>称呼<input id="p-name" maxlength="128" placeholder="可选"/></label>
                <label>邮箱<input id="p-email" type="email" maxlength="255" placeholder="可选"/></label>
            </div>
            <input id="p-website" class="honeypot" tabindex="-1" autocomplete="off"/>
            <button type="submit" class="primary">提交工单</button>
            <p id="create-error" class="error"></p>
        </form>
    </section>

    <section id="ticket-panel" class="portal-card hidden">
        <div class="portal-ticket-head">
            <div>
                <h2 id="p-ticket-subject"></h2>
                <div class="muted small" id="p-ticket-meta"></div>
            </div>
            <button id="p-refresh" class="ghost">刷新</button>
        </div>
        <div id="p-token-box" class="token-box">
            <div class="muted small">查询码（请保存，刷新页面后需要用它查询）</div>
            <code id="p-token"></code>
            <button id="p-copy" class="link">复制</button>
        </div>
        <div id="p-attachments" class="attachments hidden"></div>
        <form id="p-upload-form" class="upload-row">
            <input id="p-file" type="file" accept="image/png,image/jpeg,image/gif,image/webp,application/pdf,text/plain"/>
            <button type="submit" class="ghost">上传附件</button>
        </form>
        <div id="p-messages" class="portal-messages"></div>
        <form id="p-reply-form" class="portal-reply">
            <textarea id="p-reply" rows="3" placeholder="补充说明或回复客服"></textarea>
            <button type="submit" class="primary">发送</button>
        </form>
        <div id="p-csat" class="csat hidden">
            <div class="muted small" id="p-csat-title">问题已关闭，请评价本次服务</div>
            <div class="stars" id="p-stars"></div>
            <textarea id="p-csat-comment" rows="2" placeholder="补充评价（可选）"></textarea>
            <button id="p-csat-submit" class="ghost">提交评价</button>
        </div>
    </section>

    <section id="lookup-panel" class="portal-card">
        <h2>查询已有工单</h2>
        <form id="lookup-form" class="portal-form">
            <label>工单 ID<input id="p-lookup-id" required placeholder="创建工单时返回的 ID"/></label>
            <label>查询码<input id="p-lookup-token" required placeholder="创建工单时返回的查询码"/></label>
            <button type="submit" class="ghost">查询</button>
            <p id="lookup-error" class="error"></p>
        </form>
    </section>
</main>
<script src="/portal.js"></script>
</body>
</html>
